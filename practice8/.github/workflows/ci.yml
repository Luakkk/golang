name: Go CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ─── Stage 1: Run tests and enforce coverage ─────────────────────────────────
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Download dependencies
        run: go mod download

      - name: Run all tests (verbose)
        run: go test -v ./...

      - name: Generate coverage profile (exclude generated mocks)
        # The repository package contains only auto-generated mock code which
        # cannot be meaningfully covered. We exclude it so the threshold reflects
        # real business logic coverage only.
        run: |
          go test -coverprofile=coverage.out \
            $(go list ./... | grep -v '/repository')

      - name: Check coverage threshold (≥ 80%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if [ $(echo "$COVERAGE < 80" | bc -l) -eq 1 ]; then
            echo "❌ Coverage ${COVERAGE}% is below the required 80% threshold"
            exit 1
          fi
          echo "✅ Coverage check passed: ${COVERAGE}% >= 80%"

      - name: Generate HTML coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload HTML coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html

  # ─── Stage 2: Fake deploy (only runs if tests & coverage pass) ───────────────
  deploy:
    name: Fake Deploy
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
      - name: Simulate deployment
        run: |
          echo "================================================"
          echo "  ✅ All tests passed and coverage >= 80%!"
          echo "  🚀 Starting deployment to production..."
          echo "  📦 Building application..."
          echo "  🔄 Deploying to server..."
          echo "  ✅ Deployment successful!"
          echo "================================================"
